<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doguito Petshop | Productos</title>
    <link rel="icon" href="../assets/img/doguitoadm.svg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/base/base.css">
    <link rel="stylesheet" href="../assets/css/componentes/header.css">
    <link rel="stylesheet" href="../assets/css/lista_cliente.css">
    <link rel="stylesheet" href="../assets/css/componentes/table.css">
    <link rel="stylesheet" href="../assets/css/componentes/button.css">
</head>
<body>
    <header class="header container">
        <img src="../assets/img/doguitoadm.svg" alt="Logotipo Doguito" class="header__logo">
        <nav>
            <ul class="header__list-nav">
                <li class="header__link"><a href="#">Dashboard</a></li>
                <li class="header__link"><a href="./listar_produc.html">Productos</a></li>
                <li class="header__link"><a href="./listar_cliente.html">Clientes</a></li>
                <li class="header__link"><a href="./listar_pets.html">Pets</a></li>
            </ul>
        </nav>
    </header>
    <main class="clientes-container">
        <h1 class="card__title">Lista de Productos</h1>
        <div class="table-actions">
            <a href="./registro_produc.html" class="simple-button simple-button--add">Nuevo Producto</a>
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th class="table__column--p">ID</th>
                    <th class="table__column--p">Nombre</th>
                    <th class="table__column--p">Precio</th>
                    <th class="table__column--m">Acciones</th>
                </tr>
            </thead>
            <tbody data-table-products></tbody>
        </table>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/uuid/8.3.2/uuid.min.js"></script>
    <script type="module" src="../controllers/produc_controller.js"></script>
</body>
</html>
